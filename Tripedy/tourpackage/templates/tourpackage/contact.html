{% extends 'tourpackage/basic.html' %}

{% block title %} Contact Us {% endblock %}

{% block body %} 

<div class="container my-4">

    <h2>Contact Us</h2>
    
      <form action="/tourpackage/contact/" method="POST" class="row g-3">{% csrf_token %}
        <div class="row-md-5">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name">
          </div>
        <div class="col-md-6 my-2">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="abc@gmail.com">
        </div>
        <div class="col-md-6 my-2">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter Your Phone Number">
        </div>
        <div class="col-12 my-2">
          <label for="peraddress" class="form-label">Permanent Address</label>
          <input type="text" class="form-control" id="perddress" name="peraddress" placeholder="Apartment, studio, or floor">
        </div>
        <div class="col-md-6 my-2">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" name="city">
        </div>
        <div class="col-md-4 my-2">
          <label for="state" class="form-label">State</label>
          <select id="state" class="form-select" name="state">
            <option selected>Choose...</option>
            <option>Maharashtra</option>
            <option>Gujarat</option>
            <option>Madhya Pradesh</option>
            <option>Kernataka</option>
            <option>Rajasthan</option>
            <option>Goa</option>
            <option>Chattisghar</option>
            <option>Telangana</option>
            <option>Uttar Pradesh</option>
          </select>
        </div>
        <div class="col-md-2 my-2">
          <label for="zip" class="form-label">Zip</label>
          <input type="text" class="form-control" id="zip" name="zip">
        </div>
        <div class="mb-3 my-2">
          <label for="desc" class="form-label">Any Query?</label>
          <textarea class="form-control" id="desc" rows="3" name="desc"></textarea>
        </div>
        <div class="col-12 my-2">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck">
            <label class="form-check-label" for="gridCheck">
              Check me out
            </label>
          </div>
        </div>
        <div class="col-12 my-2">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
</div>

{% endblock %}


{% block js %} 
<script>
    {% if thank %}
    alert('Thank you for contacting us! We will get back to you within 24 hours.')
    document.location = '/tourpackage/contact';
    {% endif %}
</script>
{% endblock %}
