{% extends 'tourpackage/basic.html' %}

{% block title %} {{package.package_name}} - Tripedy  {% endblock %}

{% block body %} 

<div class="container my-4">
    <div class="row">
        <div class="col-md-4">
        <div class="row">
            <img src="/media/{{package.image}}" width="150px" height="270px">
        </div>
            <div class="col">
                <a href="/tourpackage"><button class="btn btn-primary my-3">Back To HomePage</button></a>
            </div>
        </div>
        <div class="col-md-8">
            <h1>{{package.package_name}}</h1>
            <p><h3><b>₹{{package.price}} </b></h3><h5>per person</h5></p>
            <p><h5><br>{{package.desc}}</h5></p>
        </div>
    </div>
</div>

{% endblock %}
